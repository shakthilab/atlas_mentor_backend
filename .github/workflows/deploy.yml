name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: atlas_mentor
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test with Maven
        run: mvn -B clean verify
        env:
          SPRING_PROFILES_ACTIVE: test
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/atlas_mentor
          SPRING_DATASOURCE_USERNAME: testuser
          SPRING_DATASOURCE_PASSWORD: testpass

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/

      - name: Backup database before deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p /home/ec2-user/db_backups
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            PGPASSWORD='${{ secrets.DB_PASSWORD }}' pg_dump -U ${{ secrets.DB_USER }} -h localhost ${{ secrets.DB_NAME }} > /home/ec2-user/db_backups/backup_$TIMESTAMP.sql
            ls -t /home/ec2-user/db_backups/*.sql | tail -n +11 | xargs -r rm --

      - name: Backup current jar before deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cp /home/ec2-user/atlas_mentor_backend/target/atlasmentor-0.0.1-SNAPSHOT.jar \
               /home/ec2-user/atlas_mentor_backend/target/atlasmentor-0.0.1-SNAPSHOT.jar.bak || true

      - name: Copy jar to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/atlasmentor-0.0.1-SNAPSHOT.jar"
          target: "/home/ec2-user/atlas_mentor_backend/target/"

      - name: Restart service and verify health
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo systemctl restart atlasmentor
            sleep 15
            curl -f http://localhost:8080/actuator/health || (echo "Health check failed" && exit 1)