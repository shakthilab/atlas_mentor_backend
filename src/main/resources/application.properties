spring.application.name=atlasmentor

# Active profile — MUST be overridden in production.
# Set environment variable SPRING_PROFILES_ACTIVE=prod (or JVM flag -Dspring.profiles.active=prod).
# Leaving this as "dev" in a production deployment will enable SQL logging and verbose output.
spring.profiles.active=dev

# Common properties (shared across all profiles)
jwt.expiration=3600
jwt.refresh-expiration=604800

# ===== SQL / Hibernate logging — safe defaults (dev profile overrides these) =====
# Suppress SQL output in any environment that does not explicitly opt in.
# Two independent paths must both be off to guarantee no SQL in logs:
#   1. spring.jpa.show-sql — Hibernate's built-in stdout printer
#   2. logging.level.org.hibernate.SQL — the SLF4J logger Hibernate also writes to
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=WARN
# Suppresses bind-parameter values (would expose actual data row values)
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN


