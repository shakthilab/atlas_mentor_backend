spring.application.name=atlasmentor

# Active profile — MUST be overridden in production.
# Set environment variable SPRING_PROFILES_ACTIVE=prod (or JVM flag -Dspring.profiles.active=prod).
# Leaving this as "dev" in a production deployment will enable SQL logging and verbose output.
spring.profiles.active=prod

# Common properties (shared across all profiles)
jwt.expiration=3600
jwt.refresh-expiration=604800
# Absolute session ceiling: refresh tokens stop renewing after this many days regardless of activity
jwt.refresh-absolute-max-days=30

# Frontend URL — overridden per profile (dev: localhost:3000, prod: see application-prod.properties)
app.frontend.url=http://localhost:4200

# Lead import (see LeadImportController): default Spring Boot multipart limit is 1MB,
# too small for a real lead spreadsheet. LeadLinkResolverService enforces its own
# 15MB cap on link-fetched files independently of this.
# Also covers task-attachment uploads (TaskAttachmentUploadService) - 30MB gives
# headroom above that service's own 25MB video cap (see app.attachments.* below) so a
# large-but-valid video reaches our code's clear rejection message instead of being
# cut off here first with a generic one.
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=30MB

# Task attachment upload limits (TaskAttachmentUploadService) - enforced before any
# compression is attempted, so an oversized file is rejected cheaply. Video gets a
# higher cap since raw phone-camera footage is the file type most likely to blow
# through it.
app.attachments.max-size-video-mb=25
app.attachments.max-size-default-mb=10

# Cloudflare R2 (S3-compatible) object storage for task attachments (proof-section and
# comment-section uploads alike - see TaskAttachmentUploadService / R2StorageService).
# Real values belong in env vars (R2_ACCOUNT_ID etc.) or the per-profile properties
# files below - never hard-code a real secret here.
r2.account-id=${R2_ACCOUNT_ID:}
r2.access-key-id=${R2_ACCESS_KEY_ID:}
r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
r2.bucket-name=${R2_BUCKET_NAME:}
# Optional: a public bucket URL or custom domain fronting the bucket. When unset,
# R2StorageService falls back to the R2 S3 endpoint URL directly, which only resolves
# publicly if the bucket's public access is turned on in the Cloudflare dashboard.
r2.public-base-url=${R2_PUBLIC_BASE_URL:}

# ===== SQL / Hibernate logging — safe defaults (dev profile overrides these) =====
# Suppress SQL output in any environment that does not explicitly opt in.
# Two independent paths must both be off to guarantee no SQL in logs:
#   1. spring.jpa.show-sql — Hibernate's built-in stdout printer
#   2. logging.level.org.hibernate.SQL — the SLF4J logger Hibernate also writes to
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=WARN
# Suppresses bind-parameter values (would expose actual data row values)
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN


