spring.application.name=atlasmentor

# PostgreSQL Database Configuration - Development
spring.datasource.url=jdbc:postgresql://localhost:5432/atlas_mentor
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=Root@123

# HikariCP Connection Pool - Development
spring.datasource.hikari.pool-name=AtlasMentor-Dev
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=60000
# Log a warning if a connection is held for more than 15 s (dev only)
spring.datasource.hikari.leak-detection-threshold=15000

# JPA/Hibernate Configuration - Development
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
# Opt in to SQL output in dev — these override the safe defaults in application.properties
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

