spring.application.name=atlasmentor

# PostgreSQL Database Configuration - Development
spring.datasource.url=jdbc:postgresql://localhost:5432/atlas_mentor
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=Root@123

# HikariCP Connection Pool - Development
spring.datasource.hikari.pool-name=AtlasMentor-Dev
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=60000
# Log a warning if a connection is held for more than 15 s (dev only)
spring.datasource.hikari.leak-detection-threshold=15000

# JPA/Hibernate Configuration - Development
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Flyway Configuration - Development
# baseline-on-migrate=true lets Flyway co-exist with tables already created by Hibernate DDL.
# baseline-version must track the latest migration file actually reflected in this DB's schema
# (currently V29) - baseline-version=0 would make Flyway treat every V1..V29 migration as still
# pending and try to replay them (including V1's CREATE TABLEs) against tables that already
# exist via ddl-auto=update, which is exactly why this DB never had a flyway_schema_history
# table: Flyway never got past that first collision. Bump this whenever a migration here is
# confirmed already applied to the dev DB by other means (Hibernate DDL, a manual fix, etc.).
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=29
spring.flyway.locations=classpath:db/migration
# Opt in to SQL output in dev — these override the safe defaults in application.properties
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

